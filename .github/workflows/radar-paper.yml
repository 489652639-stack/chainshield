name: 热点雷达只读观察APK构建
on:
  push:
    branches: ['feature/radar-paper-observe-*']
    paths: ['radar/**', '.github/workflows/radar-paper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: 检查语法
        run: |
          node --check radar/web/app.js
          python -m py_compile radar/observe_ci.py
          mkdir -p radar/observe-artifacts radar/observe-evidence
      - name: 构建受控测试证书
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/radar-ci.key -out /tmp/radar-ci.crt -subj '/CN=RadarCI' -addext 'subjectAltName=IP:10.0.2.2,IP:127.0.0.1'
          mkdir -p radar/android/app/src/debug/res/raw radar/android/app/src/debug/res/xml
          cp /tmp/radar-ci.crt radar/android/app/src/debug/res/raw/radar_test_ca.crt
          cat > radar/android/app/src/debug/res/xml/network_security_config.xml <<'XML'
          <network-security-config><domain-config><domain includeSubdomains="false">10.0.2.2</domain><trust-anchors><certificates src="@raw/radar_test_ca"/></trust-anchors></domain-config></network-security-config>
          XML
          cat > radar/android/app/src/debug/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:networkSecurityConfig="@xml/network_security_config"/></manifest>
          XML
      - name: 构建安卓测试包
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          chmod +x gradlew radar/device_test.sh
          ./gradlew -p radar/android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: 启用模拟器加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 安装启动、受控展示及真实HTTPS鉴权检查
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: bash radar/device_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChainShield-Radar-observe
          path: |
            radar/observe-artifacts/*.apk
            radar/observe-evidence/observe-*
            radar/observe-evidence/final-*
            radar/observe-evidence/apk-*
            radar/android/app/build/reports/lint-results-debug.html
