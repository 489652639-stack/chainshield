plugins { id 'com.android.application' }
android {
    namespace 'com.chainshield.radar'
    compileSdk 35
    defaultConfig {
        applicationId 'com.chainshield.radar'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.2.0-observe'
        testInstrumentationRunner 'com.chainshield.radar.SmokeTest'
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
